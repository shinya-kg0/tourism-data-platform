[project]
name = "ingest"
version = "0.1.0"
description = "観光統計 Excel を解析して BigQuery の raw 層に取り込む"
requires-python = ">=3.12"
dependencies = [
    "google-cloud-bigquery",
    "google-cloud-storage",
    "openpyxl",
    "pandas",
    "pyarrow",
    "xlrd",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[project.scripts]
ingest = "ingest.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
