# Workflows「ingest」：Eventarc から起動し、Cloud Run Job「ingest」を実行する（仕様書 9 章、D-16）
#
# 引数は Eventarc の CloudEvent。data に landing のオブジェクト名と世代番号が入る。
# ジョブの終了コードで、やり直すかどうかを分ける（仕様書 5.2、D-04）
#   0：succeeded / skipped / rejected → ここで終わる（データの誤りはやり直しても直らない）
#   1：failed（一時的なエラー）       → 間隔を広げながら最大 3 回やり直す
#
# 環境変数（Terraform の user_env_vars）
#   INGEST_JOB  Cloud Run Job の名前

main:
  params: [event]
  steps:
    - init:
        assign:
          - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - location: ${sys.get_env("GOOGLE_CLOUD_LOCATION")}
          - job: ${sys.get_env("INGEST_JOB")}
          - object_name: ${event.data.name}
          - generation: ${string(event.data.generation)}
    - run_job:
        try:
          call: googleapis.run.v2.projects.locations.jobs.run
          args:
            name: ${"projects/" + project + "/locations/" + location + "/jobs/" + job}
            body:
              overrides:
                containerOverrides:
                  - args:
                      - ${object_name}
                      - --generation
                      - ${generation}
                    env:
                      - name: WORKFLOW_EXECUTION_ID
                        value: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
            # ジョブのタイムアウト（15 分）より長く待つ
            connector_params:
              timeout: 1800
          result: execution
        retry:
          predicate: ${log_and_retry}
          max_retries: 3
          backoff:
            initial_delay: 60
            max_delay: 600
            multiplier: 2
    - done:
        return:
          object_name: ${object_name}
          generation: ${generation}
          execution: ${execution.metadata.name}

# ジョブが終了コード 1 で終わった（またはジョブを起動できなかった）ときに呼ばれる
log_and_retry:
  params: [e]
  steps:
    - log:
        call: sys.log
        args:
          severity: WARNING
          json:
            message: Cloud Run Job「ingest」が失敗したため、やり直す
            error: ${e}
    - retry:
        return: true
