version: 2

models:
  - name: mart_kpi_yearly
    description: |
      ダッシュボード「1. サマリ」用。全国の延べ宿泊者数（全体・日本人・外国人）と外国人比率、前年比（年）。
      日本人 = 全体 − 外国人で計算している。
    columns:
      - name: year
        description: 年
        data_tests: [unique, not_null]
      - name: year_date
        description: 年の 1 月 1 日（Looker Studio の時系列グラフ用）
        data_tests: [unique, not_null]
      - name: total_guest_nights
        description: 延べ宿泊者数・全体（人泊）
        data_tests: [not_null]
      - name: japanese_guest_nights
        description: 延べ宿泊者数・日本人（人泊）。全体 − 外国人
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: foreign_guest_nights
        description: 延べ宿泊者数・外国人（人泊）
        data_tests: [not_null]
      - name: foreign_share
        description: 外国人比率（0〜1）
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: total_guest_nights_yoy
        description: 延べ宿泊者数・全体の前年比（例：0.05 ＝ 5％増）。最初の年は NULL
      - name: japanese_guest_nights_yoy
        description: 延べ宿泊者数・日本人の前年比
      - name: foreign_guest_nights_yoy
        description: 延べ宿泊者数・外国人の前年比
      - name: is_covid_period
        description: コロナの影響期間（2020〜2022 年）。調査の中止や急減があるため、グラフで区別する
